<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocPules</title>
<style>
  :root{
    --bg:#F4F6FA; --card:#FFFFFF; --ink:#16233A; --mut:#6B7A94;
    --line:#DFE5EF; --navy:#1F3864; --navy-d:#16294A; --loss:#C0392B;
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1521; --card:#161E2E; --ink:#E8EDF6; --mut:#93A1B8;
      --line:#27314A; --navy:#4C7BD1; --navy-d:#3C66B4;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:grid; place-items:center; padding:16px;
  }
  .wrap{width:100%; max-width:384px}
  .brand{display:flex; align-items:center; gap:10px; margin:0 0 18px 2px}
  .mark{
    width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.02em;
  }
  .brand h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
  .brand p{margin:1px 0 0;font-size:12.5px;color:var(--mut)}
  form{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:22px; box-shadow:0 1px 2px rgba(22,35,58,.05),0 8px 24px -14px rgba(22,35,58,.18);
  }
  label{display:block; font-size:12.5px; font-weight:600; color:var(--mut);
        margin:0 0 5px; letter-spacing:.01em}
  input{
    width:100%; padding:10px 11px; font:inherit; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px;
  }
  input:focus{outline:2px solid color-mix(in srgb,var(--navy) 42%, transparent); outline-offset:1px}
  .f + .f{margin-top:14px}
  button{
    width:100%; margin-top:19px; padding:11px 14px; font:inherit; font-weight:620;
    color:#fff; background:var(--navy); border:0; border-radius:8px; cursor:pointer;
  }
  button:hover{background:var(--navy-d)}
  button[disabled]{opacity:.6; cursor:default}
  .msg{
    margin-top:14px; padding:9px 11px; border-radius:8px; font-size:13.5px;
    background:color-mix(in srgb,var(--loss) 10%, transparent);
    color:var(--loss); border:1px solid color-mix(in srgb,var(--loss) 26%, transparent);
  }
  .foot{margin:14px 2px 0; font-size:12px; color:var(--mut)}
  .setup{
    margin:0 0 16px; padding:13px 14px; border-radius:var(--r); font-size:13.5px; line-height:1.5;
    background:color-mix(in srgb,#B7791F 11%, var(--card));
    border:1px solid color-mix(in srgb,#B7791F 38%, transparent);
  }
  .setup b{display:block; margin-bottom:5px}
  .setup code{
    font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;
    background:color-mix(in srgb,var(--ink) 9%, transparent);
    padding:1px 5px; border-radius:4px;
  }
  .setup ol{margin:8px 0 0; padding-inline-start:19px}
  .setup li{margin:3px 0}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="mark">DP</div>
      <div>
        <h1>DocPules</h1>
        <p>Clinical operations &middot; session analytics</p>
      </div>
    </div>
    <div id="setup" class="setup" hidden></div>
    <form id="f" novalidate>
      <div class="f">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="f">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="go" type="submit">Sign in</button>
      <div id="msg" class="msg" hidden></div>
    </form>
    <p class="foot">This portal is restricted. Access is logged.</p>
  </div>
<script>
(function(){
  var f=document.getElementById('f'), go=document.getElementById('go'), msg=document.getElementById('msg');
  function show(t){ msg.textContent=t; msg.hidden=!t; }

  /* Before anybody has an account, "those details did not match" is a dead end:
     nothing the person types can ever work and the page gives no way to find
     that out. So ask the server whether it has been set up, and if not, say
     exactly what is missing. */
  fetch('/api/setup',{credentials:'same-origin'})
    .then(function(r){ return r.ok? r.json() : null; })
    .then(function(j){
      if(!j||(!j.needsSetup&&!j.note)) return;
      var box=document.getElementById('setup');
      var esc=function(t){ return String(t||'').replace(/[&<>]/g,function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); };
      box.innerHTML =
        '<b>' + (j.needsSetup
          ? 'No account exists yet, so no password will work.'
          : 'The last password reset did not take effect.') + '</b>' +
        esc(j.note) +
        '<ol>' +
          '<li>In your hosting dashboard, set <code>ADMIN_EMAIL</code> and ' +
            '<code>ADMIN_PASSWORD</code>.</li>' +
          '<li>The password must be <b>10 characters or more</b>, or it is refused ' +
            'and no account is made.</li>' +
          '<li>Restart the service, then reload this page.</li>' +
        '</ol>' +
        (j.emailHint? '<div style="margin-top:8px">ADMIN_EMAIL is currently <code>' +
          esc(j.emailHint) + '</code> \u2014 sign in with exactly that.</div>' : '');
      box.hidden=false;
    })
    .catch(function(){ /* an older server has no such route; nothing to show */ });
  f.addEventListener('submit', function(e){
    e.preventDefault();
    show('');
    var email=document.getElementById('email').value.trim();
    var password=document.getElementById('password').value;
    if(!email||!password){ show('Fill in both boxes.'); return; }
    go.disabled=true; go.textContent='Signing in…';
    fetch('/api/login',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,password:password})
    }).then(function(r){
      return r.json().then(function(j){ return {ok:r.ok,j:j}; });
    }).then(function(o){
      if(!o.ok) throw new Error(o.j&&o.j.error||'That did not work.');
      location.replace('/');
    }).catch(function(err){
      show(err.message);
      go.disabled=false; go.textContent='Sign in';
      document.getElementById('password').value='';
      document.getElementById('password').focus();
    });
  });
})();
</script>
</body>
</html>
